<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#14171c">
  <title>FloorVoice</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="brand"><span class="dot"></span>FloorVoice</div>
    <button id="worker-btn" class="worker-btn" type="button" aria-expanded="false"
            aria-controls="settings">…</button>
  </header>

  <section id="settings" class="settings" hidden>
    <p class="settings-who"><span id="settings-name"></span><span id="settings-line" class="muted"></span></p>
    <label class="settings-row" for="lang-override">
      <span>Language</span>
      <select id="lang-override">
        <option value="">Worker default</option>
        <option value="ta">தமிழ்</option>
        <option value="si">සිංහල</option>
        <option value="en">English</option>
      </select>
    </label>
    <button id="switch-worker" class="switch-worker" type="button">Switch worker</button>
  </section>

  <div id="pin-screen" class="pin-screen" hidden>
    <div class="pin-box">
      <p class="pin-title">Enter your PIN</p>
      <p class="pin-sub"><span lang="ta">உங்கள் PIN</span> · <span lang="si">ඔබේ PIN</span></p>
      <div id="pin-dots" class="pin-dots" aria-live="polite"><i></i><i></i><i></i><i></i></div>
      <p id="pin-msg" class="pin-msg" role="alert"></p>
      <form id="key-form" class="key-form" autocomplete="off" hidden>
        <input id="key-input" type="text" inputmode="text" autocapitalize="off" spellcheck="false"
               placeholder="Paste the access key" aria-label="Access key">
        <button type="submit">Save</button>
      </form>
      <div id="pin-pad" class="pin-pad">
        <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button>
        <button type="button" data-k="3">3</button><button type="button" data-k="4">4</button>
        <button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
        <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button>
        <button type="button" data-k="9">9</button>
        <button type="button" data-k="clear" aria-label="Clear">C</button>
        <button type="button" data-k="0">0</button>
        <button type="button" data-k="back" aria-label="Delete">⌫</button>
      </div>
    </div>
  </div>

  <main>
    <section class="stage" aria-live="polite">
      <p id="hint" class="hint">Hold the button and speak — Tamil or English.<br>
        <span lang="ta">பொத்தானை அழுத்திப் பிடித்து பேசுங்கள்.</span></p>
      <p id="transcript" class="transcript" hidden></p>
      <div id="card" class="card" hidden>
        <p id="card-status" class="card-status"></p>
        <p id="card-text" class="card-text"></p>
        <div id="options" class="options"></div>
        <div id="photo-row" class="photo-row" hidden>
          <button id="photo-btn" type="button" class="photo-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9Zm3 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg>
            <span id="photo-label">Show me the part</span>
          </button>
          <img id="photo-thumb" class="photo-thumb" alt="Photo being read" hidden>
          <input id="photo-input" type="file" accept="image/*" capture="environment" hidden>
        </div>
        <div id="count-row" class="count-row" hidden>
          <div class="count-view">
            <video id="count-video" class="count-video" playsinline muted autoplay></video>
            <div class="count-guide" aria-hidden="true"><span class="count-arrow">→</span></div>
            <p id="count-timer" class="count-timer" hidden>0 s</p>
          </div>
          <p class="count-help">Pan slowly, left to right, once. 5–15 seconds.</p>
          <button id="count-btn" type="button" class="count-btn">● Start filming</button>
          <button id="count-native" type="button" class="count-native">Use the camera app instead</button>
          <input id="count-input" type="file" accept="video/*" capture="environment" hidden>
        </div>
        <div id="review-row" class="review-row" hidden>
          <div class="review-pic">
            <img id="review-img" alt="Counted frame">
            <canvas id="review-canvas"></canvas>
          </div>
          <p id="review-note" class="review-note"></p>
        </div>
        <div id="card-links"></div>
        <p id="card-meta" class="card-meta"></p>
      </div>
    </section>

    <section class="history">
      <h2>Recent</h2>
      <ol id="history"></ol>
    </section>
  </main>

  <footer class="dock">
    <form id="typed" class="typed" autocomplete="off">
      <input id="typed-input" type="text" placeholder="…or type it" enterkeyhint="send">
    </form>
    <button id="ptt" class="ptt" type="button" aria-label="Hold to talk">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
      <span id="ptt-label">Hold to talk</span>
    </button>
  </footer>

  <script src="app.js" type="module"></script>
</body>
</html>
