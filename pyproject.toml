[project]
name = "floorvoice"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "openai==3.41.0",
    "pydantic==2.14.2",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
    "uvicorn[standard]==0.54.0",
    "websockets==17.3",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "respx==0.23.1",
    "ruff==0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
